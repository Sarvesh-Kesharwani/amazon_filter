<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<title>Small Promo Tile (440x280)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 440px; height: 280px; font-family: 'Segoe UI', -apple-system, sans-serif; background: #1a1a1a; color: #f5f0e1; overflow: hidden; display: flex; align-items: center; justify-content: center; }

  .content { text-align: center; padding: 32px; }
  .icon { font-size: 36px; margin-bottom: 12px; }
  h1 { font-size: 26px; font-weight: 800; line-height: 1.2; margin-bottom: 8px; }
  h1 span { color: #e8a820; }
  p { font-size: 14px; color: rgba(245,240,225,0.55); line-height: 1.5; max-width: 340px; margin: 0 auto 16px; }
  .tags { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .tag { background: rgba(245,240,225,0.08); border: 1px solid rgba(245,240,225,0.12); padding: 5px 12px; border-radius: 100px; font-size: 11px; font-weight: 600; }
</style>
</head>
<body>
  <div class="content">
    <div class="icon">&#9889;</div>
    <h1>Amazon Product <span>Filter</span></h1>
    <p>Filter by reviews, rating, Prime, Best Seller & more. Sort by Magic Score.</p>
    <div class="tags">
      <span class="tag">6 Filters</span>
      <span class="tag">Smart Sort</span>
      <span class="tag">Free</span>
    </div>
  </div>
</body>
</html>
