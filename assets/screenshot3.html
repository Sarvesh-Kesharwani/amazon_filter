<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<title>Screenshot 3 — Supported Domains (1280x800)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1280px; height: 800px; font-family: 'Segoe UI', -apple-system, sans-serif; background: #f5f0e1; overflow: hidden; display: flex; align-items: center; justify-content: center; }

  .content { text-align: center; }
  .content h1 { font-size: 48px; font-weight: 800; color: #1a1a1a; margin-bottom: 12px; }
  .content p { font-size: 20px; color: #6b6350; margin-bottom: 40px; }

  .domains { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; margin-bottom: 48px; }
  .domain {
    background: #1a1a1a; color: #f5f0e1; font-size: 18px; font-weight: 700;
    padding: 14px 32px; border-radius: 100px;
  }

  .features { display: flex; gap: 40px; justify-content: center; margin-top: 20px; }
  .feat { text-align: center; }
  .feat-num { font-size: 48px; font-weight: 800; color: #e8a820; }
  .feat-label { font-size: 15px; color: #6b6350; font-weight: 600; }
</style>
</head>
<body>
  <div class="content">
    <h1>Works Across Amazon</h1>
    <p>One extension, five Amazon domains. Your filters carry everywhere.</p>
    <div class="domains">
      <span class="domain">amazon.com</span>
      <span class="domain">amazon.in</span>
      <span class="domain">amazon.co.uk</span>
      <span class="domain">amazon.de</span>
      <span class="domain">amazon.ca</span>
    </div>
    <div class="features">
      <div class="feat"><div class="feat-num">6</div><div class="feat-label">Filters</div></div>
      <div class="feat"><div class="feat-num">4</div><div class="feat-label">Sort Options</div></div>
      <div class="feat"><div class="feat-num">0</div><div class="feat-label">Data Collected</div></div>
    </div>
  </div>
</body>
</html>
