<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amazon Product Filter</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1>Amazon Filter</h1>

    <!-- Auth section -->
    <div id="authSection">
      <button id="signInBtn" class="google-btn">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59a14.5 14.5 0 0 1 0-9.18l-7.98-6.19a24.01 24.01 0 0 0 0 21.56l7.98-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        Sign in with Google
      </button>
      <div id="userInfo" class="user-info" style="display:none">
        <span id="userEmail"></span>
        <a href="#" id="signOutBtn">Sign out</a>
      </div>
    </div>

    <div class="divider"></div>

    <div class="setting-row">
      <span class="label">Enable Filter</span>
      <label class="toggle">
        <input type="checkbox" id="enabled">
        <span class="slider"></span>
      </label>
    </div>

    <div class="divider"></div>

    <div class="setting-group" id="filterSettings">
      <span class="label">Filter By</span>

      <!-- Review Count -->
      <div class="filter-item">
        <label class="checkbox-row">
          <input type="checkbox" id="f_review_count">
          <span>Review Count</span>
        </label>
        <div class="threshold-row" id="th_review_count">
          <input type="number" id="val_review_count" min="0" step="1" placeholder="Min e.g. 100">
        </div>
      </div>

      <!-- Rating -->
      <div class="filter-item">
        <label class="checkbox-row">
          <input type="checkbox" id="f_rating">
          <span>Rating</span>
        </label>
        <div class="threshold-row" id="th_rating">
          <input type="number" id="val_rating" min="0" max="5" step="0.1" placeholder="Min e.g. 4.0">
        </div>
      </div>

      <!-- Best Seller -->
      <div class="filter-item">
        <label class="checkbox-row">
          <input type="checkbox" id="f_best_seller">
          <span>Best Seller Only</span>
        </label>
      </div>

      <!-- Prime -->
      <div class="filter-item">
        <label class="checkbox-row">
          <input type="checkbox" id="f_prime">
          <span>Prime Only</span>
        </label>
      </div>

      <!-- Amazon's Choice -->
      <div class="filter-item">
        <label class="checkbox-row">
          <input type="checkbox" id="f_amazons_choice">
          <span>Amazon's Choice Only</span>
        </label>
      </div>

      <!-- Limited Time Deal -->
      <div class="filter-item">
        <label class="checkbox-row">
          <input type="checkbox" id="f_limited_time_deal">
          <span>Limited Time Deal Only</span>
        </label>
      </div>

      <div class="divider"></div>

      <!-- Sort -->
      <span class="label">Sort By</span>
      <select id="sortBy">
        <option value="none">None (default order)</option>
        <option value="review_count_desc">Review Count (high to low)</option>
        <option value="rating_desc">Rating (high to low)</option>
        <option value="magic_score_desc" class="pro-option">&#128274; Magic Score (high to low)</option>
        <option value="price_desc" class="pro-option">&#128274; Price (high to low)</option>
        <option value="price_asc" class="pro-option">&#128274; Price (low to high)</option>
      </select>
    </div>

    <p class="status" id="status"></p>

    <div class="divider"></div>
    <a href="https://buymeacoffee.com/sarvesh42" target="_blank" class="bmc-link">
      ☕ Buy Me a Coffee
    </a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
